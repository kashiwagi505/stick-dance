name: Claude

# Issue・PRのコメントで @claude にメンションすると起動する対話モード。
# PR作成時の自動レビュー（claude-pr-review.yml）以降の再レビュー・質問はこちらで行う。
# 再レビューを依頼するときは「@claude .agents/codex-pr-reviewer.md に従って再レビューして」のように書く。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  # secrets は if: で直接参照できないため、ゲートジョブで有無を判定する。
  # あわせて @claude メンションの有無もここで判定し、無関係なコメントでは本体を起動しない。
  check-token:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN
        id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: check-token
    if: needs.check-token.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 再レビュー依頼でも差分をファイル単位に切り出せるように、master と履歴を取得する
          # （理由は claude-pr-review.yml のコメントを参照）
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Claudeサブスクリプション（Team）に紐づくOAuthトークンで認証する
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # レビュー指摘を行コメントで投稿できるようにする（コードは変更させない）。
          # 許可・禁止するツールと差分の読み方は claude-pr-review.yml と揃える。揃っていないと、
          # 「自動レビューが途中で止まったので @claude で再依頼」が同じ場所で再び止まる。
          # こちらはコメント本文がプロンプトになるため、読み方は --append-system-prompt で渡す。
          claude_args: |
            --model sonnet
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(cut:*),Bash(wc:*),Bash(grep:*),Bash(ls:*)"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
            --append-system-prompt "差分を読むときは、まず git diff origin/master...HEAD --stat で変更ファイルと規模を把握し、本文はファイル単位で git diff origin/master...HEAD -- <パス> を読む。Bashの出力は約3万文字で打ち切られるため、打ち切られたら sed -n や cut -c でより狭い範囲に分割して読み直し、打ち切られた出力のまま判断しない。1行が数千文字あるファイル（ドキュメント/管理表/レビュー指摘表/ など）は、チェックアウト済みの実ファイルを Read ツールで開いて照合する。読み切れなかった範囲があれば、それを明記して報告する。"
