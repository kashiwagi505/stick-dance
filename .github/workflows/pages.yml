name: Pages

# GitHub Pages への公開（インフラ要件 I1、判断ログ D14、技術選定の設計方針 3.5）。
# いまは手動実行だけ。リポジトリは 2026-11-15 に公開にした（無料プランでは非公開リポジトリから Pages を出せない）。
# master への push でも自動で公開するかは未決。決めたら on: に足す。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      # 公開する前に、PRと同じ検査を通す
      - name: check (typecheck + lint + test)
        run: npm run check

      # base は vite.config.ts で /stick-dance/ に合わせてある（技術選定の設計方針 3.5）
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
