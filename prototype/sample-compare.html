<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドラムとベースの聞き比べ</title>
<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
<style>
  :root { --bg:#14161c; --card:#1d2029; --fg:#e8e8ee; --dim:#8a90a0; --line:#2c303b; --accent:#ffcf5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.lead { color: var(--dim); margin: 0 0 18px; line-height: 1.7; font-size: 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 10px; }
  .opts { display:grid; gap: 8px; }
  .opts label { display:block; padding: 8px 10px; border:1px solid var(--line); border-radius: 8px; cursor:pointer; font-size: 14px; line-height: 1.5; }
  .opts label:has(input:checked) { border-color: var(--accent); background: rgba(255,207,90,.06); }
  .opts small { display:block; color: var(--dim); font-size: 12px; margin-left: 22px; }
  .row { display:flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; align-items:center; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--line); background:#2a2f3b; color:var(--fg); cursor:pointer; }
  button.play { background: var(--accent); color:#1a1a1a; border-color: var(--accent); font-weight: 600; }
  #status { color: var(--dim); font-size: 13px; }
  .beat { display:flex; gap:3px; margin: 14px 0 0; }
  .beat span { flex:1; height:6px; background:#262a33; border-radius:2px; }
  .beat span.on { background: var(--accent); }
  .beat span.bar { margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>ドラムとベースの聞き比べ</h1>
  <p class="lead">録音した楽器の音（D）に決めたので、製品で使える素材（CC0）の中からドラムとベースを選びます。
  旋律・和音・高い旋律は、前の聞き比べの D と同じピアノです。ドラムとベースを1つずつ選んで「再生」を押してください（2周で止まります）。
  素材は GitHub から直接読み込むので、最初の1回は数秒〜十数秒かかります。</p>

  <section class="card">
    <h2>ドラム</h2>
    <div class="opts" id="drums">
      <label><input type="radio" name="drums" value="room" checked> Virtuosity Drums・部屋の響きあり<small>CC0。ジャズ用のドラムセットを部屋のマイクで録った音。自然に広がる</small></label>
      <label><input type="radio" name="drums" value="mid"> Virtuosity Drums・近め<small>同じドラムを近めのマイクで。輪郭がはっきり</small></label>
      <label><input type="radio" name="drums" value="lofi"> Virtuosity Drums・ローファイ<small>同じドラムを古い録音のような質感で。こもった味</small></label>
      <label><input type="radio" name="drums" value="synth"> 合成のドラム（比べる用）<small>前の聞き比べの C と同じ合成音</small></label>
    </div>
  </section>

  <section class="card">
    <h2>ベース</h2>
    <div class="opts" id="bass">
      <label><input type="radio" name="bass" value="meat" checked> Meatbass・指ではじくコントラバス<small>CC0。古いコントラバスのピチカート。太く丸い</small></label>
      <label><input type="radio" name="bass" value="sneaky"> Sneakybass・静かにはじくコントラバス<small>CC0。とても静かなピチカート。柔らかく、指の音も入る</small></label>
      <label><input type="radio" name="bass" value="darkblack"> Black And Blue Basses・エレキベース（指弾き）<small>CC0。5弦のエレキベースを指で。ポップスでよく聞く音</small></label>
      <label><input type="radio" name="bass" value="synth"> 合成のベース（比べる用）<small>前の聞き比べの C・D と同じ合成音</small></label>
    </div>
    <div class="row" style="margin-top:10px"><label><input type="checkbox" id="bassUp"> ベースを1オクターブ上げる</label><span id="bassNote" style="color:var(--dim);font-size:12px">（録音によって高さの付け方が違うので、低すぎると感じたら入れてください）</span></div>
  </section>

  <section class="card">
    <div class="row" id="layers">
      <b>鳴らす楽器:</b>
      <label><input type="checkbox" data-layer="drums" checked> ドラム</label>
      <label><input type="checkbox" data-layer="bass" checked> ベース</label>
      <label><input type="checkbox" data-layer="lead" checked> 旋律</label>
      <label><input type="checkbox" data-layer="pad" checked> 和音</label>
      <label><input type="checkbox" data-layer="high" checked> 高い旋律</label>
    </div>
    <div class="row" style="margin-top:12px"><button class="play" id="play">再生</button><button id="stop">止める</button><span id="status"></span></div>
    <div class="beat" id="beat"></div>
  </section>
</main>
<script>
"use strict";
const BPM = 100, STEP = 60 / BPM / 2, STEPS = 32, LOOPS = 2;
const SCALE = [57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
const ROOTS = [45, 41, 36, 43];
const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
const LEAD = [5,6,7,null,6,5,null,4,  3,null,5,6,null,5,3,null,  4,5,7,8,7,null,5,null,  6,null,5,4,3,null,null,null];
const HIGH = { 9: 7, 13: 8, 25: 9, 27: 8, 29: 7 };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const RAW = "https://raw.githubusercontent.com/sfzinstruments/";

// ---------- 素材の場所 ----------
const VD = mic => {
  const base = `${RAW}virtuosity_drums/master/Samples/${mic}/`;
  return {
    kick: `${base}kick/${mic}_kick_snoff_vl3_rr1.flac`,
    snare: `${base}snare/${mic}_snare_center_vl24.flac`,
    hat1: `${base}hh/${mic}_hh_closed_vl3_rr1.flac`, hat2: `${base}hh/${mic}_hh_closed_vl3_rr2.flac`,
    hat3: `${base}hh/${mic}_hh_closed_vl2_rr3.flac`, hat4: `${base}hh/${mic}_hh_closed_vl2_rr4.flac`,
    open: `${base}hh/${mic}_hh_open_vl3_rr1.flac`,
    crash: `${base}crash/${mic}_crash_crash_vl2_rr1.flac`,
  };
};
const BASSES = {
  meat: { base: `${RAW}karoryfer.meatbass/master/Samples/pizz/`, notes: ["a1","c2","a2","c3","a3","c4"], file: n => `${n}_vl3_rr1.wav`, vol: 0 },
  sneaky: { base: `${RAW}karoryfer.sneakybass/main/Samples/pluck/`, notes: ["c2","d2","e2","f2","g2","a2","b2","c3","e3","g3","c4"], file: n => `sneakybass_${n}_pluck_rr1.wav`, vol: 8 },
  darkblack: { base: `${RAW}karoryfer.black-and-blue-basses/main/Samples/darkblack/reg/`, notes: ["b1","c2","d2","e2","f2","g2","a2","b2","c3","e3","g3","c4"], file: n => `darkblack_${n}_mf_rr1.wav`, vol: 0 },
};

// ---------- 音の部品（読み込んだものは使い回す） ----------
let built = false, master, comp, verb, piano, synthKick, synthSnare, synthHat, synthBass;
const drumKits = {}, bassSamplers = {};
async function buildCommon() {
  if (built) return; built = true;
  master = new Tone.Gain(0.8).toDestination();
  comp = new Tone.Compressor(-18, 3).connect(master);
  verb = new Tone.Reverb({ decay: 2.4, wet: 0.25 }).connect(comp);
  const urls = {};
  for (const n of ["A1","C2","D#2","F#2","A2","C3","D#3","F#3","A3","C4","D#4","F#4","A4","C5","D#5","F#5","A5","C6","D#6","F#6","A6"]) urls[n] = n.replace("#", "s") + ".mp3";
  piano = new Tone.Sampler({ urls, baseUrl: "https://tonejs.github.io/audio/salamander/", release: 1 }).connect(verb);
  piano.volume.value = -6;
  synthKick = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.35, sustain: 0 } }).connect(comp);
  synthSnare = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.18, sustain: 0 } }).connect(new Tone.Filter(1800, "bandpass").connect(verb));
  synthHat = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }).connect(new Tone.Filter(8000, "highpass").connect(comp));
  synthSnare.volume.value = -8; synthHat.volume.value = -14;
  synthBass = new Tone.MonoSynth({ oscillator: { type: "square" }, filter: { Q: 3 }, envelope: { attack: 0.004, decay: 0.3, sustain: 0.4, release: 0.2 },
    filterEnvelope: { attack: 0.002, decay: 0.2, sustain: 0.2, baseFrequency: 120, octaves: 3 } }).connect(comp);
  synthBass.volume.value = -6;
  await verb.ready;
}
function drumKit(name) {
  if (name === "synth" || drumKits[name]) return drumKits[name];
  const kit = new Tone.Players(VD(name)).connect(comp);
  kit.volume.value = -2;
  return (drumKits[name] = kit);
}
function bassSampler(name) {
  if (name === "synth" || bassSamplers[name]) return bassSamplers[name];
  const b = BASSES[name], urls = {};
  for (const n of b.notes) urls[n.toUpperCase()] = b.file(n);
  const s = new Tone.Sampler({ urls, baseUrl: b.base, release: 0.4 }).connect(comp);
  s.volume.value = b.vol;
  return (bassSamplers[name] = s);
}

// ---------- 譜面 ----------
function score() {
  const on = {}; document.querySelectorAll("#layers input").forEach(c => on[c.dataset.layer] = c.checked);
  const ev = [];
  for (let s = 0; s < STEPS; s++) {
    const bar = Math.floor(s / 8), b = s % 8;
    if (on.drums) {
      if (s === 0) ev.push({ s, k: "crash" });
      if (b === 0 || b === 4 || (b === 7 && bar % 2 === 1)) ev.push({ s, k: "kick" });
      if (b === 2 || b === 6) ev.push({ s, k: "snare" });
      if (s === 31) ev.push({ s, k: "open" }); else if (s !== 0) ev.push({ s, k: "hat", n: s % 4 });
    }
    if (on.bass && s % 2 === 0) ev.push({ s, k: "bass", m: ROOTS[bar] + (b % 4 === 2 ? 12 : 0) });
    if (on.lead && LEAD[s] !== null) ev.push({ s, k: "lead", m: SCALE[LEAD[s]] });
    if (on.pad && (b === 0 || b === 4)) ev.push({ s, k: "pad", ms: CHORDS[bar] });
    if (on.high && HIGH[s] !== undefined) ev.push({ s, k: "high", m: SCALE[HIGH[s]] + 12 });
  }
  return ev;
}

// ---------- 再生 ----------
let timer = null, startAt = 0;
window.__debug = { played: [], errors: [] };
const statusEl = document.getElementById("status");
function stop() {
  clearInterval(timer); timer = null;
  try { piano.releaseAll(); Object.values(bassSamplers).forEach(s => s.releaseAll()); Object.values(drumKits).forEach(k => k.stopAll()); } catch (e) {}
  beatCells.forEach(c => c.classList.remove("on"));
}
async function play() {
  await Tone.start();
  stop();
  await buildCommon();
  const drums = document.querySelector("input[name=drums]:checked").value;
  const bass = document.querySelector("input[name=bass]:checked").value;
  const up = document.getElementById("bassUp").checked ? 12 : 0;
  const kit = drumKit(drums), bs = bassSampler(bass);
  statusEl.textContent = "素材を読み込み中…";
  try { await Tone.loaded(); } catch (e) { statusEl.textContent = "読み込みに失敗: " + e.message; window.__debug.errors.push(String(e)); return; }
  statusEl.textContent = "";
  const hit = (name, t, vol = 0) => { const p = kit.player(name); p.volume.value = vol; p.start(t); };
  const H = ["hat1", "hat3", "hat2", "hat4"];
  const play1 = {
    crash: t => kit ? hit("crash", t, -6) : synthHat.triggerAttackRelease(0.4, t),
    kick: t => kit ? hit("kick", t) : synthKick.triggerAttackRelease("C1", 0.3, t),
    snare: t => kit ? hit("snare", t, -2) : synthSnare.triggerAttackRelease(0.18, t),
    hat: (t, e) => kit ? hit(H[e.n], t, e.n % 2 ? -10 : -6) : synthHat.triggerAttackRelease(0.04, t, e.n % 2 ? 0.6 : 1),
    open: t => kit ? hit("open", t, -6) : synthHat.triggerAttackRelease(0.25, t),
    bass: (t, e) => bs ? bs.triggerAttackRelease(mtof(e.m + up), STEP * 1.8, t, 0.9) : synthBass.triggerAttackRelease(mtof(e.m + up), STEP * 1.6, t),
    lead: (t, e) => piano.triggerAttackRelease(mtof(e.m), STEP * 1.2, t, 0.8),
    pad: (t, e) => piano.triggerAttackRelease(e.ms.map(m => mtof(m - 12)), STEP * 3.5, t, 0.45),
    high: (t, e) => piano.triggerAttackRelease(mtof(e.m), 0.5, t, 0.6),
  };
  const ev = score(), all = [];
  startAt = Tone.now() + 0.2;
  for (let l = 0; l < LOOPS; l++) ev.forEach(e => all.push({ e, t: startAt + (l * STEPS + e.s) * STEP }));
  all.sort((x, y) => x.t - y.t);
  // 少し先（0.15秒）までだけ予約していく。止めたら予約も止まる
  let idx = 0;
  window.__debug.played.push(drums + "+" + bass);
  const total = LOOPS * STEPS * STEP;
  timer = setInterval(() => {
    while (idx < all.length && all[idx].t < Tone.now() + 0.15) {
      const { e, t } = all[idx++];
      try { play1[e.k](t, e); } catch (err) { window.__debug.errors.push(e.k + ":" + err.message); }
    }
    const t = Tone.now() - startAt, s = Math.floor(t / STEP) % STEPS;
    beatCells.forEach((c, i) => c.classList.toggle("on", t >= 0 && i === s));
    if (t > total + 1.5) stop();
  }, 30);
}
const beat = document.getElementById("beat"), beatCells = [];
for (let i = 0; i < STEPS; i++) { const c = document.createElement("span"); if (i && i % 8 === 0) c.className = "bar"; beat.appendChild(c); beatCells.push(c); }
document.getElementById("play").addEventListener("click", play);
document.getElementById("stop").addEventListener("click", stop);
</script>
</body>
</html>
