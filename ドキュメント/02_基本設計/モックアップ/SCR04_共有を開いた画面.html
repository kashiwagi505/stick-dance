<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>棒人間ダンシング</title>
  <link rel="stylesheet" href="../画面設計/デザインシステム/tokens/tokens.css">
  <link rel="stylesheet" href="../画面設計/デザインシステム/components/部品.css">
  <link rel="stylesheet" href="css/舞台.css">
  <link rel="stylesheet" href="css/SCR03_鑑賞画面.css">
</head>
<body>
  <!-- SCR04 共有を開いた画面。設計書: ../画面設計/SCR04_共有を開いた画面.md -->
  <h1 class="visually-hidden">棒人間ダンシング</h1>
  <main class="screen view">
    <h2 class="visually-hidden">共有された踊り</h2>
    <p class="view__progress" id="progress" role="status"></p>

    <div class="stage">
      <canvas class="stage__canvas" id="stage" width="960" height="540" aria-label="舞台"></canvas>

      <!-- 再生の前・開けなかった・おわり を、この1つの重ねる案内の中身で替える -->
      <section class="overlay overlay--center view__end" id="panel" role="status" aria-labelledby="panel-title">
        <h3 class="overlay__title" id="panel-title">共有された踊り</h3>
        <p class="view__lead" id="panel-lead">4人の分身が踊ります</p>
        <div class="view__buttons">
          <button type="button" class="button button--primary" id="primary">再生する</button>
          <button type="button" class="button button--secondary" id="secondary" hidden>もう一度見る</button>
        </div>
        <p class="status status--wait" id="status" role="status"></p>
        <p class="overlay__note" id="panel-note">音が出ます</p>
      </section>

      <section class="overlay overlay--center" id="paused" role="status" aria-labelledby="paused-title" hidden>
        <h3 class="overlay__title" id="paused-title">一時停止中</h3>
        <p class="overlay__note">画面に戻ると続きから</p>
      </section>
    </div>

    <div class="score" id="score" aria-hidden="true"></div>
  </main>

  <aside class="mock-panel" aria-label="モックアップの状態切り替え">
    <span class="mock-panel__label">モックアップの状態</span>
    <button type="button" data-mock-state="loading">準備中</button>
    <button type="button" data-mock-state="ready">再生の前</button>
    <button type="button" data-mock-state="playing">鑑賞中</button>
    <button type="button" data-mock-state="end">おわり</button>
    <button type="button" data-mock-state="broken">壊れたURL</button>
    <button type="button" data-mock-state="version">別の版</button>
    <button type="button" data-mock-state="loadfail">読み込みの失敗</button>
  </aside>
  <script src="js/舞台の描画.js"></script>
  <script src="js/鑑賞の描画.js"></script>
  <script src="js/SCR04_共有を開いた画面.js"></script>
</body>
</html>
